# Stands up Solr-shaped workloads on a throwaway kind cluster so the `kube`
# commands can be exercised for real. Pods use registry.k8s.io/pause so they
# start instantly and pull nothing. See .devtools/README.md.
apiVersion: v1
kind: Namespace
metadata:
  name: solr
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: solr-cloud
  namespace: solr
  labels: {app: solr, tier: data}
spec:
  serviceName: solr-headless
  replicas: 2
  selector:
    matchLabels: {app: solr}
  template:
    metadata:
      labels: {app: solr, tier: data}
    spec:
      containers:
        - name: solrcloud
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: "100m", memory: 64Mi}
            limits: {cpu: "200m", memory: 128Mi}
          volumeMounts:
            - {name: data, mountPath: /var/solr/data}
        - name: exporter            # deliberately no resources block
          image: registry.k8s.io/pause:3.10
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {app: solr}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: solr
  labels: {app: zookeeper, tier: data}
spec:
  serviceName: zk-headless
  replicas: 1
  selector:
    matchLabels: {app: zookeeper}
  template:
    metadata:
      labels: {app: zookeeper, tier: data}
    spec:
      containers:
        - name: zookeeper
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: "50m", memory: 32Mi}     # requests only, no limits
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solr-operator
  namespace: solr
  labels: {app: solr-operator}
spec:
  replicas: 1
  selector:
    matchLabels: {app: solr-operator}
  template:
    metadata:
      labels: {app: solr-operator}
    spec:
      containers:
        - name: manager
          image: registry.k8s.io/pause:3.10
          resources:
            limits: {cpu: "200m", memory: 256Mi}     # limits only, no requests
---
apiVersion: v1
kind: Service
metadata:
  name: solr-headless
  namespace: solr
  labels: {app: solr}
spec:
  clusterIP: None
  selector: {app: solr}
  ports:
    - {port: 8983, targetPort: 8983, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: solr-external
  namespace: solr
  labels: {app: solr}
spec:
  type: NodePort
  selector: {app: solr}
  ports:
    - {name: http, port: 80, targetPort: 8983, protocol: TCP}
    - {name: https, port: 443, targetPort: 8983, protocol: TCP}
---
# Minimal Route CRD. Registering the route.openshift.io group is exactly what
# is_openshift_cluster() checks for, so this makes `sa kube list routes` real
# on a vanilla cluster.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: routes.route.openshift.io
spec:
  group: route.openshift.io
  scope: Namespaced
  names: {plural: routes, singular: route, kind: Route}
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                host: {type: string}
                to:
                  type: object
                  properties:
                    name: {type: string}
                alternateBackends:
                  type: array
                  items:
                    type: object
                    properties:
                      name: {type: string}
                port:
                  type: object
                  properties:
                    targetPort: {x-kubernetes-int-or-string: true}
                tls:
                  type: object
                  properties:
                    termination: {type: string}
---
# Minimal SolrCloud CRD, so a statefulset can carry a realistic ownerReference
# the way the Solr operator sets one on OpenShift. The CR instance lives in
# kind-custom-resources.yaml (a CR cannot be applied in the same pass that
# registers its CRD), and wiring the reference needs the CR's real uid -- see
# .devtools/README.md.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: solrclouds.solr.apache.org
spec:
  group: solr.apache.org
  scope: Namespaced
  names: {plural: solrclouds, singular: solrcloud, kind: SolrCloud}
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas: {type: integer}
